name: Build AmneziaWG macOS DMG

on:
  workflow_dispatch:       # кнопка "Run workflow" в Actions
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-dmg:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Install xcbeautify-like deps (не требуется, но для чистоты логов)
        run: echo "нет зависимостей"

      - name: Build .app
        run: bash scripts/build-macos.sh --no-archive
        shell: bash

      - name: Make DMG
        run: bash scripts/build-macos-dmg.sh --no-archive

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-macos-dmg
          path: |
            build/**/*.dmg
            *.dmg
            scripts/build/**/*.dmg
          if-no-files-found: error
          retention-days: 30
